# CodeGenX 生产部署 docker-compose
# 用 .env 文件注入敏感配置（不要提交 .env 到 Git）
# 启动：docker compose up -d --build
# 日志：docker compose logs -f backend
# 停止：docker compose down（加 -v 会清空数据卷，谨慎使用）

name: codegenx

# 所有服务共享一个网络，service 名即 DNS
networks:
  codegenx-net:
    driver: bridge

volumes:
  mysql_data:        # MySQL 数据（用户类数据、记忆真源）
  pg_data:           # PostgreSQL 主库数据
  redis_data:        # Redis 持久化数据
  qdrant_data:       # Qdrant 向量数据
  codegenx_data:     # 后端运行时数据（看板 JSON、会话快照、聊天记录）
  prometheus_data:   # Prometheus TSDB（监控 profile）
  grafana_data:      # Grafana 看板与用户配置（监控 profile）

services:
  # ═══════════════════════════════════════════════════════════
  # ① 后端 API（FastAPI + Uvicorn）
  # ═══════════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: codegenx-backend:latest
    container_name: codegenx-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env          # 真实配置（需用户手动创建，参考 .env.example）
      - ./backend/.env.example  # 提供默认值兜底
    environment:
      # Docker 网络内用 service 名访问，覆盖 .env 中的 127.0.0.1
      MYSQL_HOST: mysql
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      QDRANT_URL: qdrant
    volumes:
      - codegenx_data:/data     # 看板 JSON / 会话快照 / chat_message 落盘
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - codegenx-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8456/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5

  # ═══════════════════════════════════════════════════════════
  # ② 前端（Nginx 托管 dist + 反向代理 API）
  # ═══════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: codegenx-frontend:latest
    container_name: codegenx-frontend
    restart: unless-stopped
    environment:
      # nginx.conf 中的 set $backend_host ${BACKEND_HOST} 会读取
      BACKEND_HOST: backend
      BACKEND_PORT: "8456"
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - codegenx-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ═══════════════════════════════════════════════════════════
  # ③ MySQL（用户类数据 + 记忆真源）
  # ═══════════════════════════════════════════════════════════
  mysql:
    image: mysql:8.0
    container_name: codegenx-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me}
      MYSQL_DATABASE: ${MYSQL_DB:-dataagent}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次初始化（数据卷为空时）按文件名顺序自动执行：
      #   01 建库建表 → 02 记忆表 → 03 初始化用户（admin / boluo123）
      - ./init/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./init/memory_schema.sql:/docker-entrypoint-initdb.d/02_memory_schema.sql:ro
      - ./init/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - codegenx-net

  # ═══════════════════════════════════════════════════════════
  # ④ PostgreSQL（主业务库 + 语义层 + pgvector）
  # ═══════════════════════════════════════════════════════════
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codegenx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: Asia/Shanghai
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 首次初始化（数据卷为空时）按文件名顺序自动执行：
      #   01 语义层 schema + pgvector → 02 监控 telemetry schema
      - ./init/semantic_schema.sql:/docker-entrypoint-initdb.d/01_semantic_schema.sql:ro
      - ./init/telemetry_schema.sql:/docker-entrypoint-initdb.d/02_telemetry_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codegenx-net

  # ═══════════════════════════════════════════════════════════
  # ⑤ Redis（缓存 + 限流）
  # ═══════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: codegenx-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_me} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codegenx-net

  # ═══════════════════════════════════════════════════════════
  # ⑥ Qdrant（向量存储）
  # ═══════════════════════════════════════════════════════════
  qdrant:
    image: qdrant/qdrant:latest
    container_name: codegenx-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codegenx-net

  # ═══════════════════════════════════════════════════════════
  # ⑦ 监控栈（可选，不影响正常启停）
  #    启动：docker compose --profile monitoring up -d
  #    链路：backend /metrics → Prometheus → Grafana 看板
  #                                └─ 规则 → Alertmanager → alert-sink
  #    后端跑在宿主机时：BACKEND_TARGET=host.docker.internal:8456
  # ═══════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: codegenx-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 宿主机后端被抓取时用
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed "s|__BACKEND_TARGET__|${BACKEND_TARGET:-backend:8456}|g" \
          /etc/prometheus/prometheus.yml.tpl > /tmp/prometheus.yml
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=15d \
          --web.enable-lifecycle
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml.tpl:ro
      - ./infra/monitoring/prometheus_alerts.yml:/etc/prometheus/prometheus_alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - codegenx-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: codegenx-alertmanager
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - codegenx-net

  # 本地告警接收端：把 Alertmanager webhook 打印到容器日志，便于验证通知链路
  alert-sink:
    image: python:3.12-alpine
    container_name: codegenx-alert-sink
    restart: unless-stopped
    profiles: ["monitoring"]
    command: ["python", "/app/alert_sink.py"]
    volumes:
      - ./infra/monitoring/alert_sink.py:/app/alert_sink.py:ro
    ports:
      - "${ALERT_SINK_PORT:-9000}:9000"
    networks:
      - codegenx-net

  grafana:
    image: grafana/grafana:11.4.0
    container_name: codegenx-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - codegenx-net
