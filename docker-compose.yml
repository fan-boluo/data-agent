# CodeGenX 生产部署 docker-compose
# 用 .env 文件注入敏感配置（不要提交 .env 到 Git）
# 启动：docker compose up -d --build
# 日志：docker compose logs -f backend
# 停止：docker compose down（加 -v 会清空数据卷，谨慎使用）

name: codegenx

# 所有服务共享一个网络，service 名即 DNS
networks:
  codegenx-net:
    driver: bridge

volumes:
  mysql_data:        # MySQL 数据（用户类数据、记忆真源）
  pg_data:           # PostgreSQL 主库数据
  redis_data:        # Redis 持久化数据
  qdrant_data:       # Qdrant 向量数据
  codegenx_data:     # 后端运行时数据（看板 JSON、会话快照、聊天记录）

services:
  # ═══════════════════════════════════════════════════════════
  # ① 后端 API（FastAPI + Uvicorn）
  # ═══════════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: codegenx-backend:latest
    container_name: codegenx-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env          # 真实配置（需用户手动创建，参考 .env.example）
      - ./backend/.env.example  # 提供默认值兜底
    environment:
      # Docker 网络内用 service 名访问，覆盖 .env 中的 127.0.0.1
      MYSQL_HOST: mysql
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      QDRANT_URL: qdrant
    volumes:
      - codegenx_data:/data     # 看板 JSON / 会话快照 / chat_message 落盘
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - codegenx-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8456/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5

  # ═══════════════════════════════════════════════════════════
  # ② 前端（Nginx 托管 dist + 反向代理 API）
  # ═══════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: codegenx-frontend:latest
    container_name: codegenx-frontend
    restart: unless-stopped
    environment:
      # nginx.conf 中的 set $backend_host ${BACKEND_HOST} 会读取
      BACKEND_HOST: backend
      BACKEND_PORT: "8456"
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - codegenx-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ═══════════════════════════════════════════════════════════
  # ③ MySQL（用户类数据 + 记忆真源）
  # ═══════════════════════════════════════════════════════════
  mysql:
    image: mysql:8.0
    container_name: codegenx-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me}
      MYSQL_DATABASE: ${MYSQL_DB:-dataagent}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次初始化（数据卷为空时）按文件名顺序自动执行：
      #   01 建库建表 → 02 记忆表 → 03 初始化用户（admin / boluo123）
      - ./init/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./init/memory_schema.sql:/docker-entrypoint-initdb.d/02_memory_schema.sql:ro
      - ./init/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - codegenx-net

  # ═══════════════════════════════════════════════════════════
  # ④ PostgreSQL（主业务库 + 语义层 + pgvector）
  # ═══════════════════════════════════════════════════════════
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codegenx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: Asia/Shanghai
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 首次初始化（数据卷为空时）按文件名顺序自动执行：
      #   01 语义层 schema + pgvector → 02 监控 telemetry schema
      - ./init/semantic_schema.sql:/docker-entrypoint-initdb.d/01_semantic_schema.sql:ro
      - ./init/telemetry_schema.sql:/docker-entrypoint-initdb.d/02_telemetry_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codegenx-net

  # ═══════════════════════════════════════════════════════════
  # ⑤ Redis（缓存 + 限流）
  # ═══════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: codegenx-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_me} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codegenx-net

  # ═══════════════════════════════════════════════════════════
  # ⑥ Qdrant（向量存储）
  # ═══════════════════════════════════════════════════════════
  qdrant:
    image: qdrant/qdrant:latest
    container_name: codegenx-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codegenx-net
