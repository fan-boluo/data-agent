# Prometheus 配置模板：容器启动时由 compose 用 sed 替换 __BACKEND_TARGET__
#   backend 在 compose 网络内：backend:8456（默认）
#   后端跑在宿主机：host.docker.internal:8456（docker compose 启动时传 BACKEND_TARGET）
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# 告警交给 Alertmanager：分组/抑制/静默/路由由它负责
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/prometheus_alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # 单后端应用（FastAPI，/metrics 由 prometheus_client 暴露）
  - job_name: codegenx-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['__BACKEND_TARGET__']
        labels:
          service: codegenx-backend
