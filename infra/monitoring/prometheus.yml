# Prometheus 配置模板：容器启动时由 compose 用 sed 替换 __BACKEND_TARGET__
#   backend 在 compose 网络内：backend:8456（默认）
#   后端跑在宿主机：host.docker.internal:8456（docker compose 启动时传 BACKEND_TARGET）
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# 告警交给 Alertmanager：分组/抑制/静默/路由由它负责
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/prometheus_alerts.yml

scrape_configs:
  # 单一服务：只抓后端（job 即服务标识，告警抑制按 job 分组）
  - job_name: dataagent-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['__BACKEND_TARGET__']
    metric_relabel_configs:
      # 去掉 instance：本地进程与容器、重启换端口都会让同一模型/工具产生第二条序列
      # （状态 Gauge 会因此在看板上出现重复图例、时间错位）
      - regex: instance
        action: labeldrop
