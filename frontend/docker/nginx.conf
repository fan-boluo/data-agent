# CodeGenX 前端 Nginx 配置
# 处理：SPA history 路由 + /api /metrics 反向代理 + SSE 长连接 + 静态资源缓存

# 后端地址（docker-compose 网络内 service 名，本地调试时改成 127.0.0.1:8456）
# 可通过运行时环境变量注入：docker run -e BACKEND_HOST=backend -e BACKEND_PORT=8456 ...
set $backend_host ${BACKEND_HOST};
set $backend_port ${BACKEND_PORT};

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Prometheus 指标（后端直出，无 /api 前缀）─────────────
    location /metrics {
        proxy_pass http://$backend_host:$backend_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── API 反向代理 ─────────────────────────────────────────
    location /api/ {
        proxy_pass http://$backend_host:$backend_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 对话 SSE 长连接（关键配置）
        proxy_buffering off;          # 关缓冲才能实时推送 chunk
        proxy_cache off;
        proxy_read_timeout 300s;      # 允许后端长任务跑 5 分钟
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;

        # 客户端与 Nginx 的长连接（减少 TCP 握手）
        keepalive_timeout 300s;
    }

    # ── 健康检查（容器编排用）────────────────────────────────
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── 静态资源缓存 ─────────────────────────────────────────
    # Vite 构建产物 chunk 带 hash，可长期缓存
    location ~* \.(?:js|css|woff|woff2|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA history 路由回退 ─────────────────────────────────
    # 未命中静态文件 → 回退 index.html，由前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip 压缩（减少传输体积）─────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
}
